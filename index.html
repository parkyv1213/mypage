<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f0f1e" />
  <title>Neon Snake</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="hud">
      <h1 class="logo">NEON<span>SNAKE</span></h1>
      <div class="scores">
        <div class="score-box">
          <span class="label">SCORE</span>
          <span id="score" class="value">0</span>
        </div>
        <div class="score-box best">
          <span class="label">BEST</span>
          <span id="best" class="value">0</span>
        </div>
      </div>
    </header>

    <main class="stage">
      <canvas id="game" width="400" height="400" aria-label="게임 화면"></canvas>

      <div id="overlay" class="overlay">
        <div class="panel">
          <h2 id="overlay-title">PRESS START</h2>
          <p id="overlay-text">방향키 또는 화면을 스와이프 하세요</p>
          <button id="start-btn" class="btn">START</button>
        </div>
      </div>
    </main>

    <section class="controls" aria-label="모바일 컨트롤">
      <button class="pad up" data-dir="up" aria-label="위로">▲</button>
      <div class="row">
        <button class="pad left" data-dir="left" aria-label="왼쪽">◀</button>
        <button class="pad down" data-dir="down" aria-label="아래로">▼</button>
        <button class="pad right" data-dir="right" aria-label="오른쪽">▶</button>
      </div>
    </section>

    <footer class="foot">
      <span id="speed-label">SPEED 1</span>
      <button id="pause-btn" class="ghost" disabled>PAUSE</button>
    </footer>
  </div>

  <script src="script.js" defer></script>
</body>
</html>
