<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#1b1b3d"/>
      <stop offset="100%" stop-color="#0a0a14"/>
    </radialGradient>
    <linearGradient id="snake" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00ffd5"/>
      <stop offset="100%" stop-color="#00ffaa"/>
    </linearGradient>
    <radialGradient id="food" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd400"/>
      <stop offset="60%" stop-color="#ff2bd6"/>
      <stop offset="100%" stop-color="#ff2bd600"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <g filter="url(#glow)">
    <rect x="96"  y="288" width="64" height="64" rx="12" fill="url(#snake)" opacity="0.55"/>
    <rect x="160" y="288" width="64" height="64" rx="12" fill="url(#snake)" opacity="0.7"/>
    <rect x="224" y="288" width="64" height="64" rx="12" fill="url(#snake)" opacity="0.85"/>
    <rect x="288" y="288" width="64" height="64" rx="12" fill="url(#snake)"/>
    <rect x="288" y="224" width="64" height="64" rx="12" fill="url(#snake)"/>
  </g>
  <circle cx="160" cy="160" r="56" fill="url(#food)" filter="url(#glow)"/>
  <circle cx="316" cy="244" r="4" fill="#0a0a14"/>
  <circle cx="328" cy="256" r="4" fill="#0a0a14"/>
</svg>
